name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  MODEL_VERSION: "1.0.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train reproducible model artifact
        run: |
          python -m src.api.training \
            --artifact artifacts/model.pkl \
            --model-card artifacts/model_card.json \
            --calibration-plot artifacts/calibration_curve.png \
            --model-version "${MODEL_VERSION}"

      - name: Run tests with JUnit report
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p test-results
          pytest -q --junitxml=test-results/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-results/pytest.xml
          if-no-files-found: error

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/model.pkl
            artifacts/model_card.json
            artifacts/calibration_curve.png
          if-no-files-found: error

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts

      - name: Build Docker image
        run: docker build -t breast-cancer-api:ci .

      - name: Start container
        run: |
          docker run -d --rm --name breast-cancer-api-ci -p 8080:8080 breast-cancer-api:ci

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs breast-cancer-api-ci
          exit 1

      - name: Smoke test prediction endpoint
        run: |
          curl --fail-with-body --silent \
            -H "Content-Type: application/json" \
            --data @src/tests/fixtures/predict_valid.json \
            http://127.0.0.1:8080/api/predict | tee /tmp/predict.json
          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path("/tmp/predict.json").read_text())
          assert len(body["results"]) == 1
          assert body["results"][0]["label"] in {"benign", "malignant"}
          PY

      - name: Capture container logs
        if: always()
        run: docker logs breast-cancer-api-ci > docker-smoke.log 2>&1 || true

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-log
          path: docker-smoke.log

      - name: Stop container
        if: always()
        run: docker stop breast-cancer-api-ci || true

  persist-pr-artifacts:
    runs-on: ubuntu-latest
    needs: docker-smoke
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download trained model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts

      - name: Commit model card and reproducible artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/model.pkl artifacts/model_card.json artifacts/calibration_curve.png
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] chore: refresh trained model artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi

  persist-main-artifacts:
    runs-on: ubuntu-latest
    needs: docker-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download trained model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts

      - name: Commit reproducible artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/model.pkl artifacts/model_card.json artifacts/calibration_curve.png
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] chore: refresh trained model artifacts"
            git push origin HEAD:main
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: [docker-smoke, persist-main-artifacts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value=v${{ env.MODEL_VERSION }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
